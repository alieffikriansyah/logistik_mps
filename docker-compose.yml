services:
  web:
    build: .
    container_name: logistik_mps_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENV=development
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=
      - DB_NAME=stokbarang
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.4
    container_name: logistik_mps_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: stokbarang
    volumes:
      - logistik_mps_db_data:/var/lib/mysql
      - ./stokbarang.sql:/docker-entrypoint-initdb.d/stokbarang.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: logistik_mps_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  logistik_mps_db_data:
